<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0718">
<meta name="description" content="JC VIDEO PRO — Editor de video profesional para Android y Web con IA y Supabase.">
<title>JC VIDEO PRO — Editor de video profesional</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/styles.css">
<!-- Supabase SDK JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(registrations => {
      for (let registration of registrations) {
        registration.unregister();
      }
    });
  }
</script>
</head>
<body>

<div class="owner-top-bar" id="ownerTopBar" style="display:none; background:linear-gradient(90deg,#7c3aed,#0284c7); color:#fff; padding:6px 16px; font-size:12px; font-weight:600; display:none; justify-content:space-between; align-items:center; z-index:999;">
  <span>🛡️ Modo Dueño (soporte@jcads.net) · Plan Profesional activo sin límites</span>
  <button class="btn tiny" id="backToAdminBtn" style="background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.4); color:#fff;">← Volver a Panel Admin</button>
</div>

<div class="app" id="app">

  <header class="topbar">
    <div class="brand" title="JC VIDEO PRO">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
      </div>
      <div class="brand-name"><span class="brand-jc">JC</span> VIDEO <span class="brand-pro">PRO</span></div>
    </div>

    <div class="top-center">
      <input id="projectName" class="project-name" value="Mi proyecto" aria-label="Nombre del proyecto" maxlength="60" spellcheck="false">
      <span id="saveState" class="save-state">Listo</span>
    </div>

    <div class="top-actions">
      <button class="btn ghost icon-only" id="btnUndo" title="Deshacer (Ctrl+Z)" aria-label="Deshacer">
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a7 7 0 0 1 0 14h-2"/></svg>
      </button>
      <button class="btn ghost icon-only" id="btnRedo" title="Rehacer (Ctrl+Shift+Z)" aria-label="Rehacer">
        <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9h-9a7 7 0 0 0 0 14h2"/></svg>
      </button>
      <button class="btn ghost" id="btnNew" aria-label="Nuevo proyecto" title="Nuevo proyecto">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <span class="btn-label">Nuevo</span>
      </button>
      <button class="btn ghost" id="btnOpen" aria-label="Abrir proyecto" title="Abrir proyecto">
        <svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg>
        <span class="btn-label">Abrir</span>
      </button>
      <button class="btn ghost" id="btnTutorial" aria-label="Tutorial y ayuda" title="Manual de uso y video tutorial">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>
        <span class="btn-label">Tutorial</span>
      </button>
      <button class="btn ghost" id="btnSave">Guardar</button>
      <button class="btn primary" id="btnExport">
        <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        Exportar
      </button>
      <button class="btn premium-btn" id="btnPremium">Premium</button>
      
      <button class="btn ghost" id="btnAuth" title="Iniciar sesión o registrarse">👤 Iniciar sesión</button>
      <button class="btn ghost" id="btnSupport" title="Soporte y contacto con soporte@jcads.net">💬 Soporte</button>

      <div class="lang-dropdown-wrap" style="position:relative; display:inline-block;">
        <button class="btn ghost lang-pill" id="btnLang" title="Cambiar idioma / Language">🌐 ES ▾</button>
        <div class="lang-menu" id="langMenu" style="display:none; position:absolute; right:0; top:110%; background:var(--panel-2); border:1px solid var(--line-strong); border-radius:10px; padding:6px; z-index:100; box-shadow:var(--shadow); min-width:150px;">
          <button class="btn ghost wide" data-lang="es" style="justify-content:flex-start; font-size:11.5px; padding:6px 10px;">🇪🇸 ES — Español</button>
          <button class="btn ghost wide" data-lang="en" style="justify-content:flex-start; font-size:11.5px; padding:6px 10px;">🇺🇸 EN — English</button>
        </div>
      </div>

      <button class="btn ghost icon-only mobile-only" id="btnMoreMobile" title="Más opciones" aria-label="Más opciones">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
      </button>
      <button class="btn ghost icon-only mobile-only" id="btnPanelMobile" title="Herramientas" aria-label="Herramientas">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </header>

  <main class="workspace">
    <nav class="rail" id="rail" aria-label="Herramientas">
      <button class="rail-btn active" data-panel="media">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>
        <span>Medios</span>
      </button>
      <button class="rail-btn" data-panel="text">
        <svg viewBox="0 0 24 24"><path d="M5 6V5h14v1"/><path d="M12 5v14"/><path d="M9 19h6"/></svg>
        <span>Texto</span>
      </button>
      <button class="rail-btn" data-panel="audio">
        <svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
        <span>Audio</span>
      </button>
      <button class="rail-btn" data-panel="effects">
        <svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="4"/></svg>
        <span>Filtros</span>
      </button>
      <button class="rail-btn" data-panel="ai">
        <svg viewBox="0 0 24 24"><path d="M12 3 9.5 9.5 3 12l6.5 2.5L12 21l2.5-6.5L21 12l-6.5-2.5z"/></svg>
        <span>IA</span>
      </button>
      <div class="rail-spacer"></div>
    </nav>

    <section class="side-panel" id="sidePanel">
      <div class="side-head">
        <h2 id="panelTitle">Medios</h2>
        <button class="icon-btn" id="closePanel" aria-label="Cerrar panel">✕</button>
      </div>
      <div class="side-body" id="panelBody"></div>
    </section>

    <section class="stage" id="stage">
      <div class="stage-top">
        <span class="stage-badge" id="stageFormat">1080 × 1920 · 9:16</span>
        <div class="stage-tools">
          <button class="btn tiny ghost" id="btnFit" title="Ajustar vista">Ajustar</button>
          <button class="btn tiny ghost mobile-only" id="btnInspector" title="Propiedades del clip">Propiedades</button>
        </div>
      </div>
      <div class="stage-canvas" id="stageCanvasWrap" tabindex="0">
        <canvas id="preview" width="1080" height="1920"></canvas>
        <div class="stage-drop" id="stageDrop">
          <div class="stage-drop-inner">
            <div class="drop-icon">
              <svg viewBox="0 0 24 24"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
            </div>
            <p><strong>Arrastra aquí tus videos, fotos o música</strong></p>
            <p class="muted">o pulsa <button class="link" id="btnImportEmpty">Importar archivos</button></p>
            <p class="tiny-note">MP4, MOV, WEBM, JPG, PNG, MP3, WAV y más.</p>
          </div>
        </div>
      </div>
      <div class="transport">
        <button class="play-btn" id="btnPlay" title="Reproducir (Espacio)" aria-label="Reproducir">
          <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/></svg>
          <svg class="ic-pause" viewBox="0 0 24 24"><rect x="7" y="5" width="3.5" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="13.5" y="5" width="3.5" height="14" rx="1" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="icon-btn small" id="btnStop" title="Volver al inicio" aria-label="Volver al inicio">
          <svg viewBox="0 0 24 24"><path d="M6 5v14"/><path d="M20 5 9 12l11 7z"/></svg>
        </button>
        <div class="time-readout"><span id="timeNow">00:00.0</span><span class="sep">/</span><span id="timeTotal">00:00.0</span></div>
        <div class="transport-spacer"></div>
        <div class="select-wrap">
          <label class="mini-label" for="formatSelect">Formato</label>
          <select id="formatSelect" class="select" title="Formato para redes sociales">
            <option value="tiktok">TikTok (9:16 · 1080×1920)</option>
            <option value="youtube">YouTube (16:9 · 1920×1080)</option>
            <option value="yt-shorts">YouTube Shorts (9:16 · 1080×1920)</option>
            <option value="ig-post">Instagram Post (1:1 · 1080×1080)</option>
            <option value="ig-vertical">Instagram Vertical (4:5 · 1080×1350)</option>
            <option value="ig-reels">Instagram Reels (9:16 · 1080×1920)</option>
            <option value="fb-horizontal">Facebook Horizontal (16:9 · 1920×1080)</option>
            <option value="fb-feed">Facebook Feed Vertical (4:5 · 1080×1350)</option>
            <option value="fb-reels">Facebook Reels (9:16 · 1080×1920)</option>
          </select>
        </div>
      </div>
    </section>

    <aside class="inspector" id="inspector">
      <div class="insp-head-row">
        <h2>Propiedades</h2>
        <button id="closeInspector" class="icon-btn" aria-label="Cerrar propiedades">✕</button>
      </div>
      <div class="insp-body" id="inspectorBody"></div>
    </aside>
  </main>

  <footer class="timeline" id="timeline">
    <div class="tl-toolbar">
      <div class="tl-tools">
        <button class="btn tiny" id="btnSplit" title="Dividir el clip en el cursor (S)">Dividir</button>
        <button class="btn tiny" id="btnDeleteClip" title="Eliminar clip seleccionado (Supr)">Eliminar</button>
        <button class="btn tiny" id="btnDuplicate" title="Duplicar clip">Duplicar</button>
        <button class="btn tiny accent" id="btnAddText">+ Texto</button>
      </div>
      <div class="tl-tools">
        <button class="btn tiny ghost" id="btnZoomOut" aria-label="Alejar">−</button>
        <span id="zoomLabel" class="zoom-label">80 px/s</span>
        <button class="btn tiny ghost" id="btnZoomIn" aria-label="Acercar">+</button>
        <button class="btn tiny ghost" id="btnFitTimeline">Ajustar</button>
      </div>
    </div>
    <div class="timeline-body">
      <div class="tl-heads" id="tlHeads"></div>
      <div class="tl-scroll" id="tlScroll">
        <div class="tl-content" id="tlContent">
          <div class="tl-ruler" id="tlRuler"></div>
          <div class="tl-playhead" id="tlPlayhead"><div class="tl-playhead-grip"></div></div>
        </div>
      </div>
    </div>
  </footer>
</div>

<input type="file" id="fileMedia" accept="video/*,image/*,audio/*" multiple hidden>
<input type="file" id="fileProject" accept="application/json,.jcvideo,.json" hidden>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>
<div class="toasts" id="toasts"></div>
<div class="premium-ribbon" id="premiumRibbon" hidden>
  <span>✦ Modo Premium local activo</span>
  <button class="link" id="premiumRibbonOff">Desactivar</button>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
